<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Market Place</h1>
      <nav>
        <a href="#produk">Produk</a>
        <a href="#kontak">Kontak</a>
        <a href="#" class="cart-link"
          >Keranjang (<span id="cart-cont">0</span>)</a
        >
      </nav>
    </header>
    <main id="produk">
      <div class="product-grid">

        <div class="product-card">
          <img src="nasgor.jpg" alt="nasi goreng" />
          <h3>Laptop Gaming</h3>
          <p class="price">Rp-48.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="nasi goreng"
            data-harga="48000"
          >
            Beli Sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="gambarr.jpeg" alt="starbucks" />
          <h3>starbucks</h3>
          <p class="price">Rp-78.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="starbucks" data-harga="78000">
            Beli Sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="picture.jpg" alt="sushii" />
          <h3>sushii</h3>
          <p class="price">Rp-350.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="sushii"
            data-harga="350000"
          >
            Beli Sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="br.jpg" alt="baskin robbins" />
          <h3>ice creamm</h3>
          <p class="price">Rp-213.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="ice cream" data-harga="213000">
            Beli Sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="bobaa.jpg" alt="chatime" />
          <h3>chatime</h3>
          <p class="price">Rp-65.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="chatime"
            data-harga="65000"
            >  
          Beli Sekarang
          </button>
        </div>

        <div class="product-card">
          <img src="puyoo.jpg" alt="puyo" />
          <h3>puyo</h3>
          <p class="price">Rp-318.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="puyo"
            data-harga="318000"
            >
            Beli Sekarang
          </button>
        </div>
      </div>

    <div class="product-grid">
        <div class="product-card">
        <img src="bkk.jpg" alt="burger" />
        <h3>Laptop Gaming</h3>
        <p class="price">Rp-99.000</p>
        <div class="quantity-stepper">
        <button type="button" class="qty-btn btn-min">-</button>
        <input type="text" class="qty-value" value="1" readonly />
        <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="burger"
            data-harga="99000"
            >
            Beli Sekarang
          </button>
        </div>
    
    <footer id="kontak">
      <h3>Hubungi Kami</h3>
      <form class="contact-form">
        <label for="nama">nama:</label>
        <input type="text" id="nama" placeholder="nama kalian" />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email kalian" />

        <label for="pesan">pesan:</label>
        <textarea id="pesan" placeholder="tulis pesan yaa"></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
      <p>copyright 2026 by Reinna</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
